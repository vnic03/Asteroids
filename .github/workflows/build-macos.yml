name: Build macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install cmake sfml@2

      - name: Configure
        shell: bash
        run: |
          sfml_prefix="$(brew --prefix sfml@2)"
          brew_prefix="$(brew --prefix)"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$sfml_prefix" \
            -DMACOS_DEPENDENCY_DIRS="$sfml_prefix/lib;$brew_prefix/lib"

      - name: Build
        run: cmake --build build --parallel 3

      - name: Install and bundle dependencies
        run: cmake --install build --prefix "$PWD/stage"

      - name: Verify architecture and assets
        shell: bash
        run: |
          app="$PWD/stage/Asteroids.app"

          lipo -verify_arch "${{ matrix.arch }}" \
            "$app/Contents/MacOS/Asteroids"

          test -f "$app/Contents/Resources/assets/font/arcade-font.otf"
          test -f "$app/Contents/Resources/assets/sound/beat1.wav"
          test -f "$app/Contents/Resources/assets/sound/fire.wav"

          otool -L "$app/Contents/MacOS/Asteroids"

      - name: Ad-hoc sign test bundle
        shell: bash
        run: |
          app="$PWD/stage/Asteroids.app"

          # Sign binaries after dependency paths have been modified.
          while IFS= read -r -d '' item; do
            if /usr/bin/file -b "$item" | grep -q "Mach-O"; then
              /usr/bin/codesign \
                --force \
                --sign - \
                --timestamp=none \
                "$item"
            fi
          done < <(find "$app" -type f -print0)

          # Sign framework bundles from the inside out.
          while IFS= read -r -d '' framework; do
            /usr/bin/codesign \
              --force \
              --sign - \
              --timestamp=none \
              "$framework"
          done < <(
            find "$app" -depth -type d -name '*.framework' -print0
          )

          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$app"

          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$app"

      - name: Create ZIP
        shell: bash
        run: |
          mkdir -p dist

          /usr/bin/ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            stage/Asteroids.app \
            "dist/Asteroids-macOS-${{ matrix.arch }}.zip"

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Asteroids-macOS-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
